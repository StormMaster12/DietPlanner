name: CI

on:
  pull_request:
  push:
    branches: [master]
  # Lets update-visual-baselines.yml re-run CI after committing new baselines.
  workflow_dispatch:

jobs:
  test:
    # Pinned rather than ubuntu-latest: the visual baselines depend on the runner's fonts, so an
    # image upgrade should be a deliberate baseline refresh, not a surprise red build.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore DietPlanner.sln

      - name: Build
        run: dotnet build DietPlanner.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test DietPlanner.Tests/DietPlanner.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Install Playwright browsers
        run: |
          dotnet build DietPlanner.E2ETests/DietPlanner.E2ETests.csproj --configuration Release
          pwsh DietPlanner.E2ETests/bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - name: Run Playwright e2e tests against the built container
        run: dotnet test DietPlanner.E2ETests/DietPlanner.E2ETests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: DietPlanner.E2ETests/TestResults/VisualDiffs/
          if-no-files-found: ignore

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
