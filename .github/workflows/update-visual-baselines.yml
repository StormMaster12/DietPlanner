name: Update visual baselines

# Baselines must be rendered by the same runner image and Chromium that CI compares against, so
# they're regenerated here rather than on a developer machine. Add the `update-visual-baselines`
# label to a PR (or run this manually against a branch) and the new PNGs are committed to the
# branch, where they show up as image diffs for the reviewer to approve.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

jobs:
  update:
    # Fork PRs get a read-only token, and pushing straight to master would skip the review the
    # baselines are meant to go through.
    if: >-
      (github.event_name == 'pull_request'
        && github.event.label.name == 'update-visual-baselines'
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && github.ref_name != 'master')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Playwright browsers
        run: |
          dotnet build DietPlanner.E2ETests/DietPlanner.E2ETests.csproj --configuration Release
          pwsh DietPlanner.E2ETests/bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      # Cleared first so baselines for renamed or removed tests don't linger.
      - name: Regenerate baselines
        run: |
          rm -f DietPlanner.E2ETests/VisualBaselines/*.png
          dotnet test DietPlanner.E2ETests/DietPlanner.E2ETests.csproj --no-build --configuration Release --filter TestCategory=Visual --logger "console;verbosity=normal"
        env:
          UPDATE_VISUAL_BASELINES: "true"

      - name: Commit changed baselines
        run: |
          git add -A DietPlanner.E2ETests/VisualBaselines
          if git diff --cached --quiet; then
            echo "Baselines are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update visual baselines"
          git push origin "HEAD:$BRANCH"
          # Pushes made with GITHUB_TOKEN don't trigger pull_request workflows, so CI has to be
          # started explicitly to get a result on the new commit.
          gh workflow run ci.yml --ref "$BRANCH"

      - name: Remove label
        if: always() && github.event_name == 'pull_request'
        run: gh pr edit ${{ github.event.pull_request.number }} --repo "$GITHUB_REPOSITORY" --remove-label update-visual-baselines
